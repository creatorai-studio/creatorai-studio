<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreatorAI Studio</title>
<style>
:root{--bg:#0b0d17;--panel:#141827;--panel2:#1b2134;--text:#f5f6ff;--muted:#a5adc5;--line:#2a3148;--accent:#9b7bff;--accent2:#4db8ff;--good:#63d6a5;--shadow:0 18px 55px #0005}
[data-theme="light"]{--bg:#f4f6fb;--panel:#fff;--panel2:#eef1f9;--text:#171a2b;--muted:#65708a;--line:#dfe4ef;--accent:#6947df;--accent2:#168bd5;--shadow:0 18px 45px #26365a14}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#6f4bba22,transparent),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;min-height:100vh}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:25px 17px;background:color-mix(in srgb,var(--panel) 88%,transparent)}.brand{display:flex;align-items:center;gap:11px;padding:3px 8px 28px}.logo{width:39px;height:39px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:white;font-weight:900;font-size:19px;box-shadow:0 8px 24px #8060ed55}.brand strong{display:block;font-size:16px;letter-spacing:.1px}.brand small{color:var(--muted)}.navlabel{font-size:10px;letter-spacing:1.5px;color:var(--muted);padding:13px 11px 8px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:11px;cursor:pointer;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}.nav button.active{box-shadow:inset 3px 0 var(--accent)}.nav .ico{width:20px;text-align:center;font-size:17px}.sidebottom{position:sticky;top:calc(100vh - 100px);margin-top:35px;padding:13px;border:1px solid var(--line);border-radius:13px;color:var(--muted);font-size:12px}.main{min-width:0}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,48px);background:color-mix(in srgb,var(--bg) 80%,transparent);position:sticky;top:0;z-index:4;backdrop-filter:blur(14px)}.crumb{color:var(--muted);font-size:13px}.actions{display:flex;gap:9px;align-items:center}.smallbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}.content{max-width:1250px;margin:auto;padding:38px clamp(18px,4vw,48px) 70px}.eyebrow{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}.hero{display:flex;justify-content:space-between;align-items:center;gap:25px;margin-bottom:30px}.hero h1{font-size:clamp(28px,4vw,43px);line-height:1.12;margin:9px 0 12px;letter-spacing:-1.4px}.hero p{color:var(--muted);max-width:620px;margin:0}.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid #63d6a555;background:#63d6a512;color:var(--good);border-radius:99px;padding:7px 11px;font-size:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:var(--shadow)}.toolcard{cursor:pointer;transition:.18s;min-height:170px}.toolcard:hover{transform:translateY(-3px);border-color:var(--accent)}.toolicon{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#9b7bff25,#4db8ff25);font-size:21px;margin-bottom:17px}.toolcard h3{margin:0 0 6px;font-size:16px}.toolcard p{margin:0;color:var(--muted);font-size:13px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:34px 0 14px}.sectionhead h2{font-size:19px;margin:0}.sectionhead p{margin:3px 0 0;color:var(--muted);font-size:13px}.workspace{max-width:820px}.workspace h1{font-size:30px;margin:8px 0}.workspace>p{color:var(--muted);margin-top:0}.field{display:grid;gap:7px;margin:17px 0}.field label{font-size:13px;font-weight:650}.field input,.field textarea,.field select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px 13px;outline:none}.field textarea{min-height:125px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}.primary{border:0;background:linear-gradient(110deg,var(--accent),#6c8dff);color:white;font-weight:700;padding:11px 17px;border-radius:11px;cursor:pointer}.secondary{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer}.output{white-space:pre-wrap;min-height:110px;color:var(--text);font-size:14px}.muted{color:var(--muted)}.empty{text-align:center;padding:45px 20px;color:var(--muted)}.notice{border:1px solid #e3b65c55;background:#e3b65c10;border-radius:12px;padding:13px 15px;color:var(--muted);font-size:13px;margin-top:18px}.urdu{direction:rtl;text-align:right}.hidden{display:none!important}.hamb{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:8;inset:0 auto 0 0;width:260px;transform:translateX(-105%);transition:.2s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.hamb{display:inline-block}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebottom{position:static}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.topbar{height:65px}.content{padding-top:26px}.actions .smallbtn{padding:8px 9px}.brand{padding-bottom:18px}}
</style>
</head>
<body data-theme="dark">
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">C</div><div><strong>CreatorAI Studio</strong><small>Imagine. Create. Inspire.</small></div></div>
 <div class="navlabel" data-en="WORKSPACE" data-ur="ورک اسپیس">WORKSPACE</div>
 <nav class="nav" id="nav">
  <button class="active" data-page="home"><span class="ico">⌂</span><span data-en="Dashboard" data-ur="ڈیش بورڈ">Dashboard</span></button>
  <button data-page="image"><span class="ico">▧</span><span data-en="Image Generator" data-ur="امیج جنریٹر">Image Generator</span></button>
  <button data-page="video"><span class="ico">▶</span><span data-en="Video Generator" data-ur="ویڈیو جنریٹر">Video Generator</span></button>
  <button data-page="prompt"><span class="ico">✧</span><span data-en="Prompt Generator" data-ur="پرامپٹ جنریٹر">Prompt Generator</span></button>
  <button data-page="story"><span class="ico">✎</span><span data-en="Story & Script Writer" data-ur="کہانی اور اسکرپٹ">Story & Script Writer</span></button>
  <button data-page="editor"><span class="ico">✿</span><span data-en="Photo Editor" data-ur="فوٹو ایڈیٹر">Photo Editor</span></button>
  <button data-page="creations"><span class="ico">▤</span><span data-en="My Creations" data-ur="میری تخلیقات">My Creations</span></button>
 </nav>
 <div class="navlabel" data-en="PREFERENCES" data-ur="ترجیحات">PREFERENCES</div>
 <nav class="nav"><button data-page="settings"><span class="ico">⚙</span><span data-en="Settings" data-ur="سیٹنگز">Settings</span></button></nav>
 <div class="sidebottom">✦ <span data-en="Free starter workspace" data-ur="مفت ابتدائی ورک اسپیس">Free starter workspace</span><br><span data-en="AI services can be connected later." data-ur="AI سروسز بعد میں منسلک کی جا سکتی ہیں۔">AI services can be connected later.</span></div>
</aside>
<main class="main">
 <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="smallbtn hamb" id="menu">☰</button><span class="crumb" id="breadcrumb">Workspace / Dashboard</span></div><div class="actions"><button class="smallbtn" id="lang">اردو</button><button class="smallbtn" id="theme">☀️</button></div></header>
 <section class="content" id="page"></section>
</main>
</div>
<script>
const page=document.getElementById('page'), nav=document.getElementById('nav');let language='en';let current='home';
const copy={en:{welcome:'Your creative space, powered by imagination.',sub:'Create prompts and stories today. Connect image and video AI services when you are ready.',status:'FREE STARTER VERSION',tools:'Explore your tools',toolsSub:'Choose a workspace to get started.',recent:'Recent creations',recentSub:'Your saved outputs on this device.',empty:'Nothing saved yet. Generate a prompt or story to see it here.',make:'Create',promptTitle:'Prompt Generator',promptDesc:'Turn a simple idea into a detailed creative prompt.',idea:'Describe your idea',ideaPh:'Example: A tiny astronaut exploring a glowing forest at night',style:'Style',detail:'Extra details (optional)',detailPh:'Lighting, camera angle, mood, colors…',generate:'Generate prompt',storyTitle:'Story & Script Writer',storyDesc:'Build a story idea into a useful starting draft.',genre:'Genre',length:'Length',short:'Short',medium:'Medium',long:'Long',topic:'Story idea',topicPh:'A lost robot discovers a hidden garden…',write:'Create story draft',result:'Your result',copy:'Copy',saved:'Saved to My Creations',copied:'Copied!',imageTitle:'AI Image Generator',videoTitle:'AI Video Generator',editorTitle:'AI Photo Editor',coming:'This feature is planned for the next integration stage.',coming2:'The interface is ready. A real AI provider and API key are required to generate or edit media.',settings:'Settings',settingsDesc:'Choose how CreatorAI Studio looks and reads.',appearance:'Appearance',language:'Language',dark:'Dark',light:'Light',both:'Use the top switch to change theme.',english:'English',urdu:'Urdu',save:'Save settings',note:'This starter version runs locally in your browser. No account or paid subscription is required.',promptStyles:['Cinematic','Photorealistic','Anime','3D render','Watercolor','Minimalist']},ur:{welcome:'آپ کی تخلیقی دنیا، جہاں خیالات حقیقت بنتے ہیں۔',sub:'آج پرامپٹس اور کہانیاں بنائیں۔ جب آپ تیار ہوں تو امیج اور ویڈیو AI سروسز منسلک کریں۔',status:'مفت ابتدائی ورژن',tools:'اپنے ٹولز دیکھیں',toolsSub:'شروع کرنے کے لیے کوئی ٹول منتخب کریں۔',recent:'حالیہ تخلیقات',recentSub:'اس ڈیوائس پر محفوظ نتائج۔',empty:'ابھی کچھ محفوظ نہیں۔ اپنا پرامپٹ یا کہانی بنائیں۔',make:'بنائیں',promptTitle:'پرامپٹ جنریٹر',promptDesc:'ایک سادہ خیال کو تفصیلی تخلیقی پرامپٹ میں بدلیں۔',idea:'اپنا خیال بیان کریں',ideaPh:'مثال: رات کے وقت روشن جنگل میں ایک ننھا خلا باز',style:'انداز',detail:'اضافی تفصیلات (اختیاری)',detailPh:'روشنی، کیمرہ زاویہ، ماحول، رنگ…',generate:'پرامپٹ بنائیں',storyTitle:'کہانی اور اسکرپٹ رائٹر',storyDesc:'اپنے خیال سے کہانی کا ابتدائی مسودہ تیار کریں۔',genre:'قسم',length:'لمبائی',short:'مختصر',medium:'درمیانی',long:'طویل',topic:'کہانی کا خیال',topicPh:'ایک گمشدہ روبوٹ کو ایک خفیہ باغ ملتا ہے…',write:'کہانی کا مسودہ بنائیں',result:'آپ کا نتیجہ',copy:'کاپی کریں',saved:'میری تخلیقات میں محفوظ ہوگیا',copied:'کاپی ہوگیا!',imageTitle:'AI امیج جنریٹر',videoTitle:'AI ویڈیو جنریٹر',editorTitle:'AI فوٹو ایڈیٹر',coming:'یہ فیچر اگلے انٹیگریشن مرحلے میں شامل کیا جائے گا۔',coming2:'انٹرفیس تیار ہے۔ اصل میڈیا بنانے یا ایڈٹ کرنے کے لیے AI سروس اور API key درکار ہوگی۔',settings:'سیٹنگز',settingsDesc:'CreatorAI Studio کی شکل اور زبان منتخب کریں۔',appearance:'ظاہری انداز',language:'زبان',dark:'ڈارک',light:'لائٹ',both:'تھیم بدلنے کے لیے اوپر والا بٹن استعمال کریں۔',english:'انگریزی',urdu:'اردو',save:'سیٹنگز محفوظ کریں',note:'یہ ابتدائی ورژن آپ کے براؤزر میں چلتا ہے۔ اکاؤنٹ یا پیڈ سبسکرپشن کی ضرورت نہیں۔',promptStyles:['سنیماٹک','فوٹوریئلسٹک','اینیمی','3D رینڈر','واٹرکلر','سادہ']}};
function t(k){return copy[language][k]||copy.en[k]||k}function saved(){try{return JSON.parse(localStorage.getItem('creatorai_items')||'[]')}catch{return []}}function store(item){let a=saved();a.unshift({...item,id:Date.now()});localStorage.setItem('creatorai_items',JSON.stringify(a.slice(0,50)))}
function setLang(){document.documentElement.lang=language;document.body.classList.toggle('urdu',language==='ur');document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset[language]);document.getElementById('lang').textContent=language==='en'?'اردو':'English';render(current)}
function card(icon,title,desc,target){return `<article class="card toolcard" data-go="${target}"><div class="toolicon">${icon}</div><h3>${title}</h3><p>${desc}</p></article>`}
function render(p){current=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let title={home:'Dashboard',prompt:t('promptTitle'),story:t('storyTitle'),image:t('imageTitle'),video:t('videoTitle'),editor:t('editorTitle'),creations:t('recent'),settings:t('settings')}[p]||'Dashboard';document.getElementById('breadcrumb').textContent='CreatorAI / '+title;
if(p==='home'){page.innerHTML=`<div class="hero"><div><div class="eyebrow">CREATORAI STUDIO</div><h1>${t('welcome')}</h1><p>${t('sub')}</p></div><span class="pill">● ${t('status')}</span></div><div class="sectionhead"><div><h2>${t('tools')}</h2><p>${t('toolsSub')}</p></div></div><div class="grid">${card('✧',t('promptTitle'),language==='en'?'Create detailed prompts for your ideas.':'اپنے خیالات کے لیے تفصیلی پرامپٹس بنائیں۔','prompt')}${card('✎',t('storyTitle'),language==='en'?'Draft stories, scenes and dialogue.':'کہانیاں، مناظر اور مکالمے لکھیں۔','story')}${card('▧',t('imageTitle'),language==='en'?'Create detailed image prompts.':'تفصیلی امیج پرامپٹس بنائیں۔','image')}${card('▶',t('videoTitle'),language==='en'?'Build video prompts and storyboards.':'ویڈیو پرامپٹس اور اسٹوری بورڈ بنائیں۔','video')}${card('✿',t('editorTitle'),language==='en'?'Adjust and download your photos.':'تصاویر میں تبدیلی کریں اور ڈاؤن لوڈ کریں۔','editor')}${card('▤',t('recent'),language==='en'?'Review your saved work.':'اپنا محفوظ کام دیکھیں۔','creations')}</div><div class="sectionhead"><div><h2>${t('recent')}</h2><p>${t('recentSub')}</p></div></div><div class="card">${saved().length?saved().slice(0,3).map(x=>`<p><b>${esc(x.title)}</b> <span class="muted">· ${new Date(x.id).toLocaleDateString()}</span></p>`).join(''):`<div class="empty">${t('empty')}</div>`}</div>`;
}else if(p==='prompt'){page.innerHTML=`<div class="workspace"><div class="eyebrow">CREATIVE TOOLS</div><h1>${t('promptTitle')}</h1><p>${t('promptDesc')}</p><div class="card"><div class="field"><label>${t('idea')}</label><textarea id="idea" placeholder="${t('ideaPh')}"></textarea></div><div class="field"><label>${t('style')}</label><select id="style">${t('promptStyles').map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>${t('detail')}</label><input id="detail" placeholder="${t('detailPh')}"></div><button class="primary" id="makePrompt">✧ ${t('generate')}</button></div><div class="sectionhead"><div><h2>${t('result')}</h2></div></div><div class="card"><div class="output" id="output"><span class="muted">Your generated prompt will appear here.</span></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="secondary" id="copy" disabled>${t('copy')}</button><button class="secondary" id="save" disabled>＋ ${t('recent')}</button></div></div></div>`;
}else if(p==='story'){page.innerHTML=`<div class="workspace"><div class="eyebrow">CREATIVE TOOLS</div><h1>${t('storyTitle')}</h1><p>${t('storyDesc')}</p><div class="card"><div class="field"><label>${t('genre')}</label><select id="genre">${(language==='en'?['Adventure','Fantasy','Sci-fi','Mystery','Drama','Comedy']:['ایڈونچر','فینٹسی','سائنس فکشن','اسرار','ڈرامہ','مزاح']).map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>${t('length')}</label><select id="length"><option value="short">${t('short')}</option><option value="medium">${t('medium')}</option><option value="long">${t('long')}</option></select></div><div class="field"><label>${t('topic')}</label><textarea id="topic" placeholder="${t('topicPh')}"></textarea></div><button class="primary" id="makeStory">✎ ${t('write')}</button></div><div class="sectionhead"><h2>${t('result')}</h2></div><div class="card"><div class="output" id="output"><span class="muted">Your draft will appear here.</span></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="secondary" id="copy" disabled>${t('copy')}</button><button class="secondary" id="save" disabled>＋ ${t('recent')}</button></div></div></div>`;
}else if(p==='image'){page.innerHTML=`<div class="workspace"><div class="eyebrow">IMAGE WORKSPACE · FREE MODE</div><h1>${t('imageTitle')}</h1><p>${language==='en'?'Build a detailed image prompt, then use it with an image model when connected.':'تفصیلی امیج پرامپٹ بنائیں، پھر AI ماڈل منسلک ہونے پر استعمال کریں۔'}</p><div class="card"><div class="field"><label>${language==='en'?'What should the image show?':'تصویر میں کیا دکھانا ہے؟'}</label><textarea id="imgIdea" placeholder="${language==='en'?'A cinematic view of an ancient city at sunrise…':'طلوعِ آفتاب کے وقت قدیم شہر کا سنیماٹک منظر…'}"></textarea></div><div class="field"><label>${t('style')}</label><select id="imgStyle">${t('promptStyles').map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>${language==='en'?'Aspect ratio':'تصویر کا تناسب'}</label><select id="imgRatio"><option>1:1 square</option><option>16:9 landscape</option><option>9:16 portrait</option><option>4:3</option></select></div><div class="field"><label>${t('detail')}</label><input id="imgDetail" placeholder="${t('detailPh')}"></div><button class="primary" id="makeImagePrompt">✧ ${language==='en'?'Build image prompt':'امیج پرامپٹ بنائیں'}</button></div><div class="sectionhead"><h2>${t('result')}</h2></div><div class="card"><div class="output" id="output"><span class="muted">${language==='en'?'Your image prompt will appear here.':'آپ کا امیج پرامپٹ یہاں ظاہر ہوگا۔'}</span></div><button class="secondary" id="copy" disabled>${t('copy')}</button> <button class="secondary" id="save" disabled>＋ ${t('recent')}</button></div><div class="notice">${language==='en'?'Free mode creates the prompt only. Actual AI image rendering needs an image-generation provider/API.':'مفت موڈ صرف پرامپٹ بناتا ہے۔ اصل AI تصویر بنانے کے لیے امیج جنریشن سروس/API درکار ہوگی۔'}</div></div>`;
}else if(p==='video'){page.innerHTML=`<div class="workspace"><div class="eyebrow">VIDEO WORKSPACE · FREE MODE</div><h1>${t('videoTitle')}</h1><p>${language==='en'?'Create a video prompt and a scene-by-scene storyboard.':'ویڈیو پرامپٹ اور منظر بہ منظر اسٹوری بورڈ بنائیں۔'}</p><div class="card"><div class="field"><label>${language==='en'?'Video concept':'ویڈیو کا خیال'}</label><textarea id="vidIdea" placeholder="${language==='en'?'A small robot walks through a rainy neon city…':'ایک چھوٹا روبوٹ بارش والے نیون شہر میں چل رہا ہے…'}"></textarea></div><div class="field"><label>${language==='en'?'Duration':'دورانیہ'}</label><select id="vidDuration"><option>15 seconds</option><option>30 seconds</option><option>60 seconds</option><option>2 minutes</option></select></div><div class="field"><label>${language==='en'?'Visual style':'ویژول اسٹائل'}</label><select id="vidStyle">${t('promptStyles').map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>${language==='en'?'Camera movement':'کیمرہ موومنٹ'}</label><select id="vidCamera"><option>Slow cinematic dolly</option><option>Tracking shot</option><option>Wide establishing shot</option><option>Handheld documentary</option><option>Static locked camera</option></select></div><button class="primary" id="makeVideoPrompt">▶ ${language==='en'?'Create video plan':'ویڈیو پلان بنائیں'}</button></div><div class="sectionhead"><h2>${t('result')}</h2></div><div class="card"><div class="output" id="output"><span class="muted">${language==='en'?'Your video plan will appear here.':'آپ کا ویڈیو پلان یہاں ظاہر ہوگا۔'}</span></div><button class="secondary" id="copy" disabled>${t('copy')}</button> <button class="secondary" id="save" disabled>＋ ${t('recent')}</button></div><div class="notice">${language==='en'?'Free mode creates a production-ready prompt/storyboard, not a rendered video. Video generation requires a compatible provider/API.':'مفت موڈ ویڈیو پرامپٹ اور اسٹوری بورڈ بناتا ہے، تیار ویڈیو نہیں۔ ویڈیو بنانے کے لیے متعلقہ سروس/API درکار ہوگی۔'}</div></div>`;
}else if(p==='editor'){page.innerHTML=`<div class="workspace"><div class="eyebrow">LOCAL PHOTO TOOLS · FREE</div><h1>${t('editorTitle')}</h1><p>${language==='en'?'Upload a photo, preview simple adjustments and download the edited result.':'تصویر اپ لوڈ کریں، بنیادی تبدیلیاں دیکھیں اور ترمیم شدہ تصویر ڈاؤن لوڈ کریں۔'}</p><div class="card"><div class="field"><label>${language==='en'?'Choose a photo':'تصویر منتخب کریں'}</label><input type="file" id="photoFile" accept="image/*"></div><div class="field"><label>${language==='en'?'Brightness':'چمک'}: <span id="brightVal">100%</span></label><input type="range" id="brightness" min="50" max="150" value="100"></div><div class="field"><label>${language==='en'?'Contrast':'کنٹراسٹ'}: <span id="contrastVal">100%</span></label><input type="range" id="contrast" min="50" max="150" value="100"></div><div class="field"><label>${language==='en'?'Saturation':'رنگوں کی شدت'}: <span id="saturateVal">100%</span></label><input type="range" id="saturate" min="0" max="200" value="100"></div><div class="field"><label>${language==='en'?'Quick filter':'فوری فلٹر'}</label><select id="photoFilter"><option value="none">Original</option><option value="grayscale(1)">Black & white</option><option value="sepia(.75)">Sepia</option><option value="blur(1px)">Soft blur</option></select></div><div class="card" style="text-align:center;background:var(--bg)"><img id="photoPreview" alt="Preview" style="display:none;max-width:100%;max-height:460px;border-radius:12px"><div id="photoEmpty" class="empty">${language==='en'?'Your photo preview will appear here.':'آپ کی تصویر کا پیش منظر یہاں ظاہر ہوگا۔'}</div></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:15px"><button class="primary" id="downloadPhoto" disabled>↓ ${language==='en'?'Download edited photo':'ترمیم شدہ تصویر ڈاؤن لوڈ کریں'}</button><button class="secondary" id="resetPhoto">${language==='en'?'Reset adjustments':'تبدیلیاں ری سیٹ کریں'}</button></div></div><div class="notice">${language==='en'?'Photo adjustments run locally in your browser. No photo is uploaded to a server. These are basic editing tools, not generative AI edits.':'تصویر کی تبدیلیاں آپ کے براؤزر میں مقامی طور پر ہوتی ہیں۔ تصویر کسی سرور پر اپ لوڈ نہیں ہوتی۔ یہ بنیادی ایڈیٹنگ ہے، جنریٹو AI ایڈیٹنگ نہیں۔'}</div></div>`;
}else if(p==='creations'){let a=saved();page.innerHTML=`<div class="workspace"><div class="eyebrow">YOUR WORKSPACE</div><h1>${t('recent')}</h1><p>${t('recentSub')}</p>${a.length?a.map(x=>`<div class="card" style="margin:12px 0"><b>${esc(x.title)}</b><p class="muted">${new Date(x.id).toLocaleString()}</p><div class="output">${esc(x.text)}</div><button class="secondary" onclick="copyText(${JSON.stringify(x.text).replace(/</g,'\\u003c')})">${t('copy')}</button></div>`).join(''):`<div class="card empty">${t('empty')}</div>`}</div>`;
}else if(p==='settings'){page.innerHTML=`<div class="workspace"><div class="eyebrow">PREFERENCES</div><h1>${t('settings')}</h1><p>${t('settingsDesc')}</p><div class="card"><div class="field"><label>${t('appearance')}</label><p class="muted">${t('both')}</p><button class="secondary" id="toggleTheme">${t('dark')} / ${t('light')}</button></div><div class="field"><label>${t('language')}</label><select id="languageSelect"><option value="en">${t('english')}</option><option value="ur">${t('urdu')}</option></select></div><button class="primary" id="saveSettings">${t('save')}</button></div><div class="notice">${t('note')}</div></div>`;document.getElementById('languageSelect').value=language;document.getElementById('toggleTheme').onclick=toggleTheme;document.getElementById('saveSettings').onclick=()=>{language=document.getElementById('languageSelect').value;setLang()}}
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function copyText(s){navigator.clipboard?.writeText(s)}
function bindOutput(text,title){let out=document.getElementById('output');out.textContent=text;let c=document.getElementById('copy'),s=document.getElementById('save');c.disabled=s.disabled=false;c.onclick=()=>{copyText(text);c.textContent=t('copied');setTimeout(()=>c.textContent=t('copy'),1300)};s.onclick=()=>{store({title,text});s.textContent='✓ '+t('saved')}}
page.addEventListener('click',e=>{let go=e.target.closest('[data-go]');if(go)render(go.dataset.go);if(e.target.id==='makePrompt'){let idea=document.getElementById('idea').value.trim();if(!idea){document.getElementById('idea').focus();return}let style=document.getElementById('style').value,detail=document.getElementById('detail').value.trim();let result=`${idea}. Style: ${style}. ${detail?detail+'. ':''}High detail, coherent composition, professional quality, intentional lighting, rich visual storytelling.`;bindOutput(result,'Prompt: '+idea.slice(0,45))}if(e.target.id==='makeStory'){let topic=document.getElementById('topic').value.trim();if(!topic){document.getElementById('topic').focus();return}let genre=document.getElementById('genre').value,len=document.getElementById('length').value;let result=language==='en'?`${genre} story draft\n\nTitle: ${topic.slice(0,55)}\n\nOpening\nThe world was quieter than usual when the first unusual sign appeared. ${topic} What began as an ordinary day soon became a turning point.\n\nThe journey\nOur main character faces an unexpected challenge. Each new discovery raises the stakes, while a surprising ally offers a clue. The character must choose between the safe path and the truth.\n\nTurning point\nAt the moment when hope seems lost, a small detail reveals what was hidden all along. The character finds the courage to act, understanding that the real strength was within them.\n\nEnding\nThe challenge is overcome, but the journey leaves a lasting change. A new possibility opens, setting the stage for what comes next.`:`${genre} کہانی کا ابتدائی مسودہ\n\nعنوان: ${topic}\n\nآغاز\nدن معمول کے مطابق شروع ہوا، لیکن جلد ہی ایک غیر معمولی واقعہ پیش آیا۔ ${topic} ایک ایسا موڑ ثابت ہوا جس نے سب کچھ بدل دیا۔\n\nسفر\nمرکزی کردار کو ایک مشکل فیصلے اور کئی رکاوٹوں کا سامنا کرنا پڑتا ہے۔ ہر نیا اشارہ کہانی کو ایک نئے راز کے قریب لے جاتا ہے۔\n\nاہم موڑ\nجب امید کم ہونے لگتی ہے تو ایک چھوٹی سی حقیقت سامنے آتی ہے۔ کردار ہمت کرکے درست قدم اٹھاتا ہے۔\n\nاختتام\nمسئلہ حل ہو جاتا ہے، مگر اس سفر سے کردار کی زندگی ہمیشہ کے لیے بدل جاتی ہے۔`;if(len==='long')result+='\n\nNext scene: The consequences of the decision begin to unfold, introducing a fresh conflict and a new character.';if(len==='short')result=result.split('\n\n').slice(0,4).join('\n\n');bindOutput(result,'Story: '+topic.slice(0,45))}if(e.target.id==='makeImagePrompt'){let idea=document.getElementById('imgIdea').value.trim();if(!idea){document.getElementById('imgIdea').focus();return}let result=`${idea}. Visual style: ${document.getElementById('imgStyle').value}. Aspect ratio: ${document.getElementById('imgRatio').value}. ${document.getElementById('imgDetail').value.trim()} Professional composition, intentional lighting, clear focal subject, rich textures, coherent perspective, high visual quality. Avoid distorted anatomy, artifacts, unwanted text and watermarks.`;bindOutput(result,'Image prompt: '+idea.slice(0,40))}if(e.target.id==='makeVideoPrompt'){let idea=document.getElementById('vidIdea').value.trim();if(!idea){document.getElementById('vidIdea').focus();return}let duration=document.getElementById('vidDuration').value,style=document.getElementById('vidStyle').value,camera=document.getElementById('vidCamera').value;let result=`VIDEO CONCEPT\n${idea}\n\nPRODUCTION PROMPT\nCreate a ${duration} ${style.toLowerCase()} video. Camera: ${camera}. Maintain consistent characters, wardrobe, environment, lighting and color grading throughout. Natural motion, deliberate pacing, cinematic composition, clean transitions, no flicker, no morphing, no unwanted text or watermark.\n\nSUGGESTED STORYBOARD\n1. Establishing shot — introduce the location, atmosphere and main subject.\n2. Action shot — show the main action clearly with the selected camera movement.\n3. Detail shot — capture an expressive close-up or important visual detail.\n4. Closing shot — resolve the moment with a memorable final frame.\n\nAUDIO DIRECTION\nUse atmosphere-appropriate background sound and subtle sound effects; keep dialogue clear if present.`;bindOutput(result,'Video plan: '+idea.slice(0,40))}});
nav.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)render(b.dataset.page)});
let photoObjectUrl=null;page.addEventListener('change',e=>{if(e.target.id==='photoFile'&&e.target.files[0]){if(photoObjectUrl)URL.revokeObjectURL(photoObjectUrl);photoObjectUrl=URL.createObjectURL(e.target.files[0]);let img=document.getElementById('photoPreview');img.src=photoObjectUrl;img.style.display='inline-block';document.getElementById('photoEmpty').style.display='none';document.getElementById('downloadPhoto').disabled=false;applyPhotoFilter()} });
function applyPhotoFilter(){let img=document.getElementById('photoPreview');if(!img)return;let b=document.getElementById('brightness'),c=document.getElementById('contrast'),s=document.getElementById('saturate'),f=document.getElementById('photoFilter');if(!b||!c||!s||!f)return;document.getElementById('brightVal').textContent=b.value+'%';document.getElementById('contrastVal').textContent=c.value+'%';document.getElementById('saturateVal').textContent=s.value+'%';img.style.filter=`brightness(${b.value}%) contrast(${c.value}%) saturate(${s.value}%) ${f.value}`}
page.addEventListener('input',e=>{if(['brightness','contrast','saturate'].includes(e.target.id))applyPhotoFilter()});page.addEventListener('change',e=>{if(e.target.id==='photoFilter')applyPhotoFilter()});
page.addEventListener('click',e=>{if(e.target.id==='resetPhoto'){['brightness','contrast','saturate'].forEach(id=>{let x=document.getElementById(id);if(x)x.value=100});let f=document.getElementById('photoFilter');if(f)f.value='none';applyPhotoFilter()}if(e.target.id==='downloadPhoto'){let img=document.getElementById('photoPreview');if(!img||!img.src)return;let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;ctx.filter=img.style.filter||'none';ctx.drawImage(img,0,0);let a=document.createElement('a');a.download='creatorai-edited-photo.png';a.href=canvas.toDataURL('image/png');a.click()}});
document.getElementById('lang').onclick=()=>{language=language==='en'?'ur':'en';setLang()};function toggleTheme(){document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark';document.getElementById('theme').textContent=document.body.dataset.theme==='dark'?'☀️':'🌙'}document.getElementById('theme').onclick=toggleTheme;document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
setLang();
</script>
</body></html>
